<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
  <title>Sky Pilot - Multiplayer Uplink</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #00f3ff;
      --secondary: #0099ff;
      --danger: #ff4444;
      --health: #00ff66;
      --bg-glass: rgba(6, 11, 25, 0.90);
      --font-main: 'Rajdhani', sans-serif;
    }

    html, body {
      margin: 0; padding: 0; overflow: hidden;
      background: #000; width: 100%; height: 100%;
      font-family: var(--font-main); color: white; user-select: none;
      touch-action: none; /* Mobile controls ke liye zaroori */
    }
    
    canvas { display: block; }

    /* ================= GAMEPLAY HUD (Always on top) ================= */
    #gameHUD {
      position: fixed; inset: 0; z-index: 50; pointer-events: none;
      display: none; /* JS se toggle hoga */
    }

    /* Crosshair */
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      width: 40px; height: 40px;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(0, 243, 255, 0.5);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
    }
    #crosshair::after {
      content: ''; position: absolute; top: 50%; left: 50%;
      width: 4px; height: 4px; background: var(--primary);
      transform: translate(-50%, -50%);
      border-radius: 50%;
    }

    /* Health & Boost Bars */
    .hud-bars {
      position: absolute; bottom: 30px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 20px;
      width: min(600px, 90%);
      pointer-events: none;
    }

    .bar-container {
      flex: 1; background: rgba(0,0,0,0.6);
      height: 14px; border: 1px solid rgba(255,255,255,0.3);
      border-radius: 4px; position: relative;
      overflow: hidden;
      transform: skewX(-15deg);
    }
    .bar-fill {
      height: 100%; width: 100%;
      transition: width 0.1s linear;
    }
    #barHealth { background: var(--health); box-shadow: 0 0 15px var(--health); }
    #barBoost { background: var(--primary); box-shadow: 0 0 15px var(--primary); }
    
    .bar-label {
      position: absolute; top: -22px; left: 0;
      font-size: 0.9rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; color: rgba(255,255,255,0.8);
      transform: skewX(-15deg);
    }

    /* ================= MOBILE CONTROLS ================= */
    #mobileControls {
      position: fixed; inset: 0; z-index: 60;
      display: none; /* Touch device detect hone par show hoga */
    }
    .touch-zone {
      position: absolute; bottom: 40px; width: 140px; height: 140px;
      background: rgba(255,255,255,0.05);
      border: 2px dashed rgba(255,255,255,0.1);
      border-radius: 50%; pointer-events: auto;
    }
    #zoneLeft { left: 30px; }
    #zoneRight { right: 30px; }

    /* ================= MENU SCREENS ================= */
    #uiRoot { position: fixed; inset: 0; z-index: 999; pointer-events: none; }
    
    .panel {
      position: relative; z-index: 10; pointer-events: auto;
      background: var(--bg-glass); border: 1px solid rgba(0,243,255,0.3);
      box-shadow: 0 0 50px rgba(0,0,0,0.8); backdrop-filter: blur(12px);
      padding: 2rem; border-radius: 8px;
    }

    .centerScreen {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: min(700px, 92vw);
      display: flex; flex-direction: column; gap: 1.5rem;
    }

    .hidden { display: none !important; }

    /* Buttons & Inputs */
    input {
      background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2);
      color: white; padding: 12px; font-size: 1.2rem; outline: none; width: 100%; 
      font-family: var(--font-main); box-sizing: border-box;
    }
    button {
      padding: 14px; font-family: var(--font-main); font-weight: 700;
      font-size: 1.1rem; text-transform: uppercase; cursor: pointer;
      border: none; width: 100%; transition: 0.2s;
    }
    .primary { background: var(--primary); color: black; }
    .primary:hover { background: white; box-shadow: 0 0 20px var(--primary); }
    .danger { background: rgba(255, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }
    .danger:hover { background: var(--danger); color: white; }

    /* Top Info Bar */
    #topHUD {
      position: absolute; top: 20px; left: 20px; right: 20px;
      display: flex; justify-content: space-between; z-index: 100;
    }
    .hud-pill {
      background: rgba(0, 15, 30, 0.8); padding: 8px 16px;
      border: 1px solid rgba(0,243,255,0.3); color: var(--primary); font-weight: 700;
      transform: skewX(-15deg);
    }

    /* Leaderboard Table */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.95rem; }
    th { text-align: left; color: #888; border-bottom: 1px solid #444; padding: 8px; }
    td { padding: 12px 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .score-highlight { color: var(--primary); font-weight: bold; font-size: 1.1rem; }
    .winner-row { background: rgba(0, 243, 255, 0.15); border-left: 4px solid var(--primary); }
  </style>
</head>

<body>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <script src="./core/game-config.js"></script>
  <script src="./config/config.world.js"></script>
  <script src="./config/config.physics.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/simplex-noise@2.4.0/simplex-noise.min.js"></script>
  
  <script src="./engine/map.js"></script>
  <script src="./engine/camera-system.js"></script>
  <script src="./engine/models.js"></script>
  <script src="./engine/collision-system.js"></script>
  
  <script src="./ui/ui-manager.js"></script>
  <script src="./ui/minimap-system.js"></script>
  <script src="./audio/procedural-audio.js"></script>
  <script src="./audio/sfx-manager.js"></script>
  <script src="./audio/music-manager.js"></script> <script src="./gameplay/input-manager.js"></script>
  <script src="./gameplay/player-controller.js"></script>
  <script src="./gameplay/bullet-system.js"></script>
  <script src="./gameplay/weapon-system.js"></script>
  <script src="./gameplay/ring-system.js"></script>
  
  <script src="./multiplayer/mp-protocol.js"></script>
  <script src="./multiplayer/mp-state.js"></script>
  <script src="./multiplayer/mp-client.js"></script>
  <script src="./multiplayer/mp-hit-detection.js"></script> <script src="./core/game-manager.js"></script>
  <script src="./gameplay/multiplayer-main.js"></script>

  <div id="gameHUD">
    <div id="crosshair"></div>
    <div class="hud-bars">
      <div class="bar-container">
        <div class="bar-label" style="left:5px;">Structure</div>
        <div id="barHealth" class="bar-fill" style="width: 100%;"></div>
      </div>
      <div class="bar-container">
        <div class="bar-label" style="left:5px; color:var(--primary)">Boost</div>
        <div id="barBoost" class="bar-fill" style="width: 100%;"></div>
      </div>
    </div>
  </div>

  <div id="mobileControls">
    <div id="zoneLeft" class="touch-zone"></div>
    <div id="zoneRight" class="touch-zone"></div>
  </div>

  <div id="uiRoot">
    <div id="topHUD" class="hidden">
      <div class="hud-pill" id="hudRoom">ROOM: ----</div>
      <div class="hud-pill" id="hudScore">RINGS: 0</div>
    </div>

    <div id="screenJoin" class="panel centerScreen">
      <h1 style="margin:0; font-size:2.5rem;">SKY PILOT <span style="color:var(--primary)">UPLINK</span></h1>
      <p style="color:#888; margin-top:-5px;">Secure Combat Network</p>
      
      <input id="inpName" placeholder="ENTER CALLSIGN (e.g. Maverick)" maxlength="12">
      <div style="display:flex; gap:10px; margin-top:10px;">
        <input id="inpCode" placeholder="ROOM CODE (Optional)" maxlength="4" style="text-transform:uppercase;">
      </div>
      
      <div style="display:flex; gap:15px; margin-top:20px;">
        <button id="btnCreate" class="primary">Initialize Squad</button>
        <button id="btnJoin" style="background:transparent; border:1px solid rgba(255,255,255,0.3);">Join Squad</button>
      </div>
      <div id="joinStatus" style="margin-top:15px; color:var(--primary); font-size:0.9rem;"></div>
    </div>

    <div id="screenLobby" class="panel centerScreen hidden">
      <h1 style="margin:0;">LOBBY: <span id="lobbyCode" style="color:var(--primary)">----</span></h1>
      <p style="color:#888;">Waiting for squad deployment...</p>
      
      <div id="playerList" style="background:rgba(0,0,0,0.4); height:180px; overflow-y:auto; padding:10px; margin-bottom:20px; border:1px solid rgba(255,255,255,0.1);"></div>
      
      <button id="btnStart" class="primary">INITIATE LAUNCH</button>
      <button id="btnLeave" class="danger" style="margin-top:10px;">ABORT MISSION</button>
      <div id="lobbyStatus" style="margin-top:10px; color:#888;"></div>
    </div>

    <div id="screenEnd" class="panel centerScreen hidden">
      <div style="text-align:center;">
        <h1 id="endTitle" style="font-size:3.5rem; margin:0; text-shadow:0 0 30px currentColor;">VICTORY</h1>
        <div id="endReason" style="color:#ccc; font-size:1.1rem; margin-top:5px; margin-bottom:20px;">Mission Accomplished</div>
      </div>
      
      <table>
        <thead>
          <tr>
            <th>RANK</th>
            <th>PILOT</th>
            <th>RINGS (100pts)</th>
            <th>KILLS (500pts)</th>
            <th>TOTAL SCORE</th>
          </tr>
        </thead>
        <tbody id="statsBody"></tbody>
      </table>

      <div style="display:flex; gap:15px; margin-top:25px;">
        <button id="btnReplay" class="primary">RE-DEPLOY</button>
        <button id="btnMenu" class="danger">MAIN MENU</button>
      </div>
    </div>
  </div>

  <script>
    const el = (id) => document.getElementById(id);
    const screens = { join: el('screenJoin'), lobby: el('screenLobby'), end: el('screenEnd') };
    const hud = { root: el('gameHUD'), health: el('barHealth'), boost: el('barBoost'), top: el('topHUD'), score: el('hudScore') };
    const mobile = el('mobileControls');

    function showScreen(name) {
      Object.values(screens).forEach(s => s.classList.add('hidden'));
      if(screens[name]) screens[name].classList.remove('hidden');
      
      // HUD Visibility Logic
      if(name === 'none') {
        hud.root.style.display = 'block'; // Show Health/Boost/Crosshair
        hud.top.classList.remove('hidden'); // Show Room/Score info
        // Check for touch capability
        if('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            mobile.style.display = 'block';
        }
      } else {
        hud.root.style.display = 'none';
        hud.top.classList.add('hidden');
        mobile.style.display = 'none';
      }
    }

    // Button Events
    el('btnCreate').onclick = () => window.mpClient.createRoom(el('inpName').value);
    el('btnJoin').onclick = () => window.mpClient.joinRoom(el('inpCode').value, el('inpName').value);
    el('btnStart').onclick = () => window.mpClient.startGame();
    el('btnLeave').onclick = () => window.location.reload();
    el('btnReplay').onclick = () => window.location.reload();
    el('btnMenu').onclick = () => window.location.href = 'index.html';

    // Bridge Logic
    window.mpUIBridge = {
      onConnected: () => el('joinStatus').innerText = ">> Connection Established. Ready.",
      
      onLobbyUpdate: (msg) => {
        showScreen('lobby');
        el('lobbyCode').innerText = msg.roomId;
        el('playerList').innerHTML = msg.players.map(p => 
          `<div style="padding:8px; border-bottom:1px solid #333; display:flex; justify-content:space-between;">
             <span>${p.name}</span>
             ${p.isHost ? '<span style="color:var(--primary); font-size:0.8rem; border:1px solid var(--primary); padding:2px 5px;">HOST</span>' : ''}
           </div>`
        ).join('');
        el('btnStart').style.display = msg.you.isHost ? 'block' : 'none';
      },

      onGameStart: (msg) => {
        showScreen('none'); // Starts game, shows HUD
        el('joinStatus').innerText = "";
      },

      onGameOver: (msg) => {
        showScreen('end');
        const myId = window.mpClient.socket.id;
        const won = msg.winnerId === myId;
        
        el('endTitle').innerText = won ? "VICTORY" : "DEFEAT";
        el('endTitle').style.color = won ? "#00f3ff" : "#ff4444";
        el('endReason').innerText = msg.reason || (won ? "Airspace Secured" : "Critical Structural Failure");

        // Calculate Scores & Sort
        const players = msg.players || [];
        players.forEach(p => {
            p.finalScore = (p.rings||0)*100 + (p.kills||0)*500;
        });
        players.sort((a,b) => b.finalScore - a.finalScore);

        // Render Leaderboard
        el('statsBody').innerHTML = players.map((p, index) => {
          const isMe = p.id === myId;
          return `
            <tr class="${isMe ? 'winner-row' : ''}">
              <td style="color:${index===0 ? 'gold' : '#ccc'}">#${index+1}</td>
              <td>${p.name} ${isMe ? '(YOU)' : ''}</td>
              <td>${p.rings||0}</td>
              <td>${p.kills||0}</td>
              <td class="score-highlight">${p.finalScore}</td>
            </tr>
          `;
        }).join('');
      },

      // Called continuously by game loop
      updateHUD: (hp, boost, rings) => {
        if(hud.health) hud.health.style.width = `${Math.max(0, Math.min(100, hp))}%`;
        if(hud.boost) hud.boost.style.width = `${Math.max(0, Math.min(100, boost))}%`;
        if(hud.score) hud.score.innerText = `RINGS: ${rings}`;
      }
    };
  </script>
</body>
</html>
