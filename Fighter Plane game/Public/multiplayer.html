<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Sky Pilot - Multiplayer Uplink</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #00f3ff;
      --secondary: #0099ff;
      --danger: #ff4444;
      --bg-glass: rgba(6, 11, 25, 0.85);
      --border-glass: rgba(0, 243, 255, 0.2);
      --font-main: 'Rajdhani', sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      width: 100%;
      height: 100%;
      font-family: var(--font-main);
      color: white;
      user-select: none;
    }
    
    canvas { display: block; }

    /* ---------- UI ROOT ---------- */
    #uiRoot {
      position: fixed;
      inset: 0;
      z-index: 999;
      pointer-events: none;
    }

    /* ADVANCED BACKGROUND */
    .mpLobbyBG {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, #0d1a33 0%, #000000 100%);
    }

    .mpLobbyBG::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.4;
      animation: floatOrb 10s infinite ease-in-out;
    }
    .orb-1 { width: 300px; height: 300px; background: var(--secondary); top: 10%; left: 20%; animation-delay: 0s; }
    .orb-2 { width: 400px; height: 400px; background: var(--primary); bottom: 10%; right: 10%; animation-delay: -5s; }

    @keyframes floatOrb {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, -30px); }
    }

    /* ---------- PANEL STYLES ---------- */
    .panel {
      position: relative;
      z-index: 10;
      pointer-events: auto;
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      box-shadow: 
        0 0 30px rgba(0, 243, 255, 0.1),
        inset 0 0 20px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
      padding: 2rem;
      border-radius: 4px;
      clip-path: polygon(
        0 0, 
        100% 0, 
        100% calc(100% - 20px), 
        calc(100% - 20px) 100%, 
        0 100%
      );
    }

    .panel::after {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
    }

    .centerScreen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(700px, 90vw);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .hidden { display: none !important; }

    h1 {
      margin: 0;
      font-weight: 700;
      font-size: 2.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: white;
      text-shadow: 0 0 20px var(--primary);
    }

    .sub {
      font-size: 1rem;
      color: #8faec2;
      margin-top: -10px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--primary);
    }

    input {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
      color: white;
      font-family: var(--font-main);
      font-size: 1.2rem;
      padding: 12px 16px;
      border-radius: 2px;
      outline: none;
      transition: all 0.2s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
    }

    .btnRow {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      padding: 14px 24px;
      font-family: var(--font-main);
      font-weight: 700;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
      min-width: 140px;
    }

    .primary {
      background: var(--primary);
      color: black;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
    }
    .primary:hover {
      background: white;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.7);
      transform: translateY(-2px);
    }

    .secondary {
      background: transparent;
      border: 1px solid var(--secondary);
      color: var(--secondary);
    }
    .secondary:hover {
      background: rgba(0, 153, 255, 0.15);
      color: white;
      border-color: white;
    }

    .danger {
      background: rgba(255, 68, 68, 0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
    }
    .danger:hover {
      background: var(--danger);
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      filter: grayscale(1);
    }

    .lobbyGrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .codeBox {
      background: rgba(0,0,0,0.6);
      border: 1px dashed var(--primary);
      padding: 20px;
      text-align: center;
      font-size: 3rem;
      letter-spacing: 5px;
      color: var(--primary);
      font-weight: 700;
      text-shadow: 0 0 20px rgba(0,243,255,0.4);
      margin-bottom: 1rem;
    }

    .playerList {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
      height: 200px;
      overflow-y: auto;
      padding: 5px;
    }

    .pitem {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      animation: fadeIn 0.3s ease;
    }
    .pitem:nth-child(odd) { background: rgba(255,255,255,0.02); }

    .tagHost {
      font-size: 0.7rem;
      background: var(--primary);
      color: black;
      padding: 2px 6px;
      font-weight: bold;
      border-radius: 2px;
    }

    .status {
      min-height: 20px;
      font-size: 0.9rem;
      color: #ccc;
      margin-top: 5px;
      text-transform: uppercase;
    }

    /* HUD */
    #topHUD {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      gap: 15px;
      z-index: 100;
    }

    .hud-pill {
      background: rgba(0, 15, 30, 0.8);
      border: 1px solid rgba(0, 243, 255, 0.3);
      padding: 8px 16px;
      font-size: 1rem;
      color: var(--primary);
      font-weight: 600;
      backdrop-filter: blur(5px);
      clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px);
    }

    /* End Screen Table */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th {
      text-align: left;
      color: var(--secondary);
      border-bottom: 1px solid var(--secondary);
      padding: 8px;
      font-size: 0.9rem;
    }
    td {
      padding: 10px 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    tr:first-child td {
      color: var(--primary);
      font-weight: bold;
      text-shadow: 0 0 10px rgba(0,243,255,0.3);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 700px) {
      .lobbyGrid { grid-template-columns: 1fr; }
      h1 { font-size: 1.8rem; }
    }
  </style>
</head>

<body>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <script src="./core/game-config.js"></script>
  <script src="./config/config.world.js"></script>
  <script src="./config/config.physics.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/simplex-noise@2.4.0/simplex-noise.min.js"></script>
  <script src="./engine/map.js"></script>
  <script src="./engine/camera-system.js"></script>
  <script src="./engine/models.js"></script>
  <script src="./engine/collision-system.js"></script>

  <script src="./ui/ui-manager.js"></script>
  <script src="./ui/minimap-system.js"></script>
  <script src="./audio/procedural-audio.js"></script>
  <script src="./audio/sfx-manager.js"></script>
  <script src="./audio/music-manager.js"></script>

  <script src="./gameplay/input-manager.js"></script>
  <script src="./gameplay/player-controller.js"></script>
  <script src="./gameplay/bullet-system.js"></script>
  <script src="./gameplay/weapon-system.js"></script>
  <script src="./gameplay/ring-system.js"></script>

  <script src="./multiplayer/mp-protocol.js"></script>
  <script src="./multiplayer/mp-state.js"></script>
  <script src="./multiplayer/mp-client.js"></script>
  <script src="./multiplayer/mp-hit-detection.js"></script>

  <script src="./core/game-manager.js"></script>
  <script src="./gameplay/multiplayer-main.js"></script>

  <div id="uiRoot">

    <div id="mpLobbyBG" class="mpLobbyBG">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
    </div>

    <div id="topHUD" class="hidden">
      <div class="hud-pill" id="hudRoom">ROOM: ----</div>
      <div class="hud-pill" id="hudName">PILOT: ----</div>
      <div class="hud-pill" id="hudInfo">STATUS: LOBBY</div>
    </div>

    <div id="screenJoin" class="panel centerScreen">
      <div>
        <h1>Sky Pilot Uplink</h1>
        <div class="sub">Establish connection to the combat network.</div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div class="input-group">
          <label>Callsign (ID)</label>
          <input id="inpName" placeholder="MAVERICK" maxlength="12" />
        </div>

        <div class="input-group">
          <label>Access Code</label>
          <input id="inpCode" placeholder="A1B2" maxlength="4" style="text-transform: uppercase; letter-spacing: 2px;" />
        </div>
      </div>

      <div class="status" id="joinStatus">Systems Online. Waiting for input.</div>

      <div class="btnRow">
        <button id="btnCreate" class="primary">Initialize New Squad</button>
        <button id="btnJoin" class="secondary">Join Squad</button>
      </div>
      
      <div class="btnRow" style="margin-top: 0;">
        <button id="btnBack" class="danger">Abort Mission</button>
      </div>
    </div>

    <div id="screenLobby" class="panel centerScreen hidden">
      <div>
        <h1>Squad Lobby</h1>
        <div class="sub">Wait for squad leader to initiate launch sequence.</div>
      </div>

      <div class="lobbyGrid">
        <div>
          <label>Mission Access Code</label>
          <div id="lobbyCode" class="codeBox">----</div>

          <div class="btnRow" style="flex-direction: column;">
            <button id="btnStart" class="primary">INITIATE LAUNCH</button>
            <button id="btnLeave" class="danger">LEAVE SQUAD</button>
          </div>
          
          <div class="status" id="lobbyStatus" style="margin-top: 10px;"></div>
        </div>

        <div>
          <label>Active Pilots</label>
          <div id="playerList" class="playerList">
            </div>
        </div>
      </div>
    </div>

    <div id="screenEnd" class="panel centerScreen hidden">
      <div style="text-align: center;">
        <h1 id="endTitle">Mission Complete</h1>
        <div class="sub" id="endSub">Performance Report</div>
      </div>

      <table id="statsTable">
        <thead>
          <tr>
            <th>PILOT</th>
            <th>KILLS (500)</th>
            <th>DEATHS</th>
            <th>RINGS (100)</th>
            <th>SCORE</th>
          </tr>
        </thead>
        <tbody id="statsBody"></tbody>
      </table>

      <div class="btnRow">
        <button id="btnReplay" class="primary">RE-ENGAGE</button>
        <button id="btnEndBack" class="danger">RETURN TO BASE</button>
      </div>

      <div class="status" id="endStatus" style="text-align: center;"></div>
    </div>
  </div>

  <script>
    // ==========================================================
    // UI Controller (SAME UI, UPDATED LOGIC)
    // ==========================================================
    const el = (id) => document.getElementById(id);

    // Screens
    const screenJoin = el("screenJoin");
    const screenLobby = el("screenLobby");
    const screenEnd = el("screenEnd");
    const topHUD = el("topHUD");
    const mpLobbyBG = el("mpLobbyBG");

    // Inputs
    const inpName = el("inpName");
    const inpCode = el("inpCode");

    // Status Texts
    const joinStatus = el("joinStatus");
    const lobbyStatus = el("lobbyStatus");
    const endStatus = el("endStatus");

    // Dynamic Elements
    const lobbyCode = el("lobbyCode");
    const playerList = el("playerList");
    const hudRoom = el("hudRoom");
    const hudName = el("hudName");
    const hudInfo = el("hudInfo");
    const endTitle = el("endTitle");
    const endSub = el("endSub");
    const statsBody = el("statsBody");

    // Buttons
    const btnCreate = el("btnCreate");
    const btnJoin = el("btnJoin");
    const btnBack = el("btnBack");
    const btnStart = el("btnStart");
    const btnLeave = el("btnLeave");
    const btnReplay = el("btnReplay");
    const btnEndBack = el("btnEndBack");

    let __startLocked = false;
    let __isGameRunning = false;
    let __matchEnded = false;
    let __winnerId = null;

    function showOnly(screen) {
      [screenJoin, screenLobby, screenEnd].forEach(s => s.classList.add("hidden"));
      screen.classList.remove("hidden");
    }

    function setStatus(element, text, isError = false) {
      element.innerText = text || "";
      element.style.color = isError ? "#ff4444" : "#00f3ff";
    }

    function sanitizeCode(v) {
      return (v || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4);
    }

    inpCode.addEventListener("input", () => {
      inpCode.value = sanitizeCode(inpCode.value);
    });

    btnBack.onclick = () => window.location.href = "./index.html";
    btnEndBack.onclick = () => window.location.href = "./index.html";

    btnCreate.onclick = () => {
      const name = (inpName.value || "Pilot").trim();
      if (!window.mpClient) return setStatus(joinStatus, "Connection Module Offline", true);

      __startLocked = false;
      btnStart.disabled = false;
      setStatus(joinStatus, "Initializing Lobby.");
      window.mpClient.createRoom(name);
    };

    btnJoin.onclick = () => {
      const name = (inpName.value || "Pilot").trim();
      const code = sanitizeCode(inpCode.value);

      if (!code || code.length !== 4) return setStatus(joinStatus, "Invalid Access Code", true);
      if (!window.mpClient) return setStatus(joinStatus, "Connection Module Offline", true);

      __startLocked = false;
      btnStart.disabled = false;
      setStatus(joinStatus, "Connecting to Squad.");
      window.mpClient.joinRoom(code, name);
    };

    btnLeave.onclick = () => window.location.reload();

    btnStart.onclick = () => {
      if (__startLocked) return;
      if (!window.mpClient?.roomId) return;

      __startLocked = true;
      btnStart.disabled = true;
      btnStart.innerText = "LAUNCHING.";
      window.mpClient.startGame();
      setStatus(lobbyStatus, "Launch Sequence Initiated.");
    };

    btnReplay.onclick = () => {
      setStatus(endStatus, "Re-engaging systems...");
      setTimeout(() => window.location.reload(), 650);
    };

    // --- LOGIC UPDATES: SCORING & LEADERBOARD ---
    function _safeText(v, fallback = "0") {
      return (v === undefined || v === null) ? fallback : String(v);
    }

    function _renderEndTable(snapshotPlayers = []) {
      statsBody.innerHTML = "";
      const myId = window.mpClient?.socket?.id;

      // 1. Calculate Score: Rings*100 + Kills*500
      snapshotPlayers.forEach(p => {
         p._calcScore = (p.rings||0)*100 + (p.kills||0)*500;
      });

      // 2. Sort by Calculated Score
      const list = [...snapshotPlayers].sort((a, b) => b._calcScore - a._calcScore);

      for (const p of list) {
        const tr = document.createElement("tr");
        const name = p.name || "Pilot";
        const score = p._calcScore;

        tr.innerHTML = `
          <td>${_safeText(name)} ${p.id === __winnerId ? "🏆" : ""} ${p.id === myId ? "(YOU)" : ""}</td>
          <td>${_safeText(p.kills)}</td>
          <td>${_safeText(p.deaths)}</td>
          <td>${_safeText(p.rings)}</td>
          <td style="color:#00f3ff; font-weight:bold;">${_safeText(score)}</td>
        `;
        statsBody.appendChild(tr);
      }
    }

    // --- UI BRIDGE ---
    window.mpUIBridge = {
      onConnected() {
        setStatus(joinStatus, "✅ Uplink Established. Ready.");
        __isGameRunning = false;
        __matchEnded = false;
      },

      onDisconnected(reason) {
        setStatus(joinStatus, "❌ Uplink Lost: " + reason, true);
        __startLocked = false;
        __isGameRunning = false;
        btnStart.disabled = false;
        btnStart.innerText = "INITIATE LAUNCH";

        showOnly(screenJoin);
        topHUD.classList.add("hidden");
        mpLobbyBG.style.display = "block";
      },

      onLobbyUpdate(msg) {
        if (__isGameRunning) return;

        showOnly(screenLobby);
        topHUD.classList.remove("hidden");
        mpLobbyBG.style.display = "block";

        lobbyCode.innerText = msg.roomId || "----";
        hudRoom.innerText = "ROOM: " + (msg.roomId || "----");
        hudName.innerText = "PILOT: " + (msg.you?.name || inpName.value || "PILOT");
        hudInfo.innerText = "STATUS: LOBBY";

        playerList.innerHTML = "";
        (msg.players || []).forEach(p => {
          const div = document.createElement("div");
          div.className = "pitem";
          div.innerHTML = `<span>${p.name || "Pilot"}</span>${p.isHost ? `<span class="tagHost">HOST</span>` : ``}`;
          playerList.appendChild(div);
        });

        const isHost = !!msg.you?.isHost;
        btnStart.style.display = isHost ? "block" : "none";
        setStatus(lobbyStatus, "Awaiting Launch Command.");
      },

      onGameStart(msg) {
        __isGameRunning = true;
        __matchEnded = false;

        // Hide all screens so canvas is visible
        screenJoin.classList.add("hidden");
        screenLobby.classList.add("hidden");
        screenEnd.classList.add("hidden");

        topHUD.classList.remove("hidden");
        mpLobbyBG.style.display = "none";

        hudInfo.innerText = "STATUS: ENGAGED";
        setStatus(lobbyStatus, "Engaged.");
      },

      onGameOver(msg) {
        __matchEnded = true;
        __winnerId = msg?.winnerId || null;
        
        const myId = window.mpClient?.socket?.id;
        const didWin = !!(__winnerId && myId && (__winnerId === myId));

        endTitle.innerText = didWin ? "VICTORY" : "DEFEAT";
        endTitle.style.color = didWin ? "#00f3ff" : "#ff4444";
        endSub.innerText = msg.reason || (didWin ? "Mission Accomplished" : "Mission Failed");

        showOnly(screenEnd);
        topHUD.classList.add("hidden");
        mpLobbyBG.style.display = "block";
        __isGameRunning = false;

        if (Array.isArray(msg?.players)) _renderEndTable(msg.players);
      },
      
      // Stub for updateHUD if main tries to call it (prevents errors)
      updateHUD: (hp, boost, rings) => {
         // No visual bars in this HTML, but function exists to prevent crash
      }
    };

    showOnly(screenJoin);
  </script>
</body>
</html>
