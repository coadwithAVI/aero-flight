<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sky Pilot</title>

  <!-- Google Fonts for that Sci-Fi look -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-cyan: #00f3ff;
      --primary-blue: #0066ff;
      --bg-dark: #050b14;
      --glass-bg: rgba(10, 25, 40, 0.65);
      --glass-border: rgba(0, 243, 255, 0.2);
      --text-glow: 0 0 10px rgba(0, 243, 255, 0.5);
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: var(--bg-dark);
      font-family: 'Rajdhani', sans-serif;
      color: white;
      overflow: hidden;
    }

    /* Animated Background Grid */
    .bg-animation {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background:
        linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      perspective: 500px;
      transform-style: preserve-3d;
      animation: flyGrid 20s linear infinite;
      z-index: -2;
    }

    .bg-vignette {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, transparent 0%, var(--bg-dark) 90%);
      z-index: -1;
      pointer-events: none;
    }

    @keyframes flyGrid {
      0% { transform: translateY(0) scale(1.5); }
      100% { transform: translateY(40px) scale(1.5); }
    }

    .container {
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      perspective: 1000px;
    }

    /* Main Glass Card */
    .card {
      width: min(500px, 90vw);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      /* Sci-fi angled corners via clip-path */
      clip-path: polygon(
        0 0,
        100% 0,
        100% calc(100% - 20px),
        calc(100% - 20px) 100%,
        0 100%
      );
      padding: 40px;
      position: relative;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
      text-align: center;
      animation: cardEntry 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* Decorative corner accents */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 4px;
      background: linear-gradient(90deg, transparent, var(--primary-cyan), transparent);
    }

    @keyframes cardEntry {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    h1 {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      font-size: 56px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 4px;
      background: linear-gradient(180deg, #fff, var(--primary-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 15px rgba(0, 243, 255, 0.4));
      position: relative;
    }

    .subtitle {
      margin-top: 12px;
      font-size: 16px;
      font-weight: 500;
      color: #a0b0c0;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .btns {
      margin-top: 35px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    a.button {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      padding: 18px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all 0.3s ease;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
      overflow: hidden;
    }

    /* Primary Button Style */
    .primary {
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid var(--primary-cyan);
      color: var(--primary-cyan);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.1);
    }

    .primary:hover {
      background: var(--primary-cyan);
      color: #000;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.6);
      transform: scale(1.02);
    }

    /* Secondary Button Style */
    .secondary {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .secondary:hover {
      border-color: #fff;
      background: rgba(255, 255, 255, 0.1);
      transform: translateX(5px);
    }

    /* Button Tech Decor */
    a.button::after {
      content: '';
      position: absolute;
      bottom: 0; right: 0;
      width: 10px; height: 10px;
      background: currentColor;
      clip-path: polygon(100% 0, 0 100%, 100% 100%);
      opacity: 0.5;
    }

    .small {
      margin-top: 25px;
      font-size: 13px;
      color: #5d7a8c;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 15px;
    }

    .footer {
      position: absolute;
      bottom: 20px;
      left: 0; right: 0;
      text-align: center;
      color: #4a5a6a;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      pointer-events: none;
    }

    .footer span {
      color: var(--primary-cyan);
      opacity: 0.6;
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      h1 { font-size: 36px; }
      .card { padding: 25px; width: 85vw; }
      a.button { padding: 14px; font-size: 14px; }
    }
  </style>
</head>

<body>
  <!-- Visual Background Elements -->
  <div class="bg-animation"></div>
  <div class="bg-vignette"></div>

  <div class="container">
    <div class="card">
      <h1>Sky Pilot</h1>
      <div class="subtitle">
        Arcade Flight Combat + Race<br/>
        // Select Operation Mode //
      </div>

      <div class="btns">
        <a class="button primary" href="./singleplayer.html">
          ▶ Initiate Singleplayer
        </a>
        <a class="button secondary" href="./multiplayer.html">
          🌐 Multiplayer Uplink
        </a>
        <a class="button secondary" href="./settings.html">
          ⚙ System Config
        </a>
      </div>

      <div class="small">
        [!] Tip: Multiplayer requires active server connection (Render).
      </div>
    </div>
  </div>

  <div class="footer">
    Sky Pilot <span>•</span> WebGL <span>•</span> Three.js
  </div>
</body>
</html>
